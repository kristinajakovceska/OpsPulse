name: OpsPulse CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        run: python -m pytest -q

      - name: Build Docker image
        run: docker compose build

      - name: Generate temporary HTTPS certificate
        run: |
          mkdir -p nginx/certs
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout nginx/certs/opspulse.key \
            -out nginx/certs/opspulse.crt \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"

      - name: Start Docker Compose
        run: docker compose up -d

      - name: Smoke test health endpoint
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent http://localhost:8080/health; then
              echo
              exit 0
            fi

            echo "Waiting for OpsPulse..."
            sleep 2
          done

          docker compose logs
          echo "OpsPulse health check did not pass."
          exit 1

      - name: Smoke test HTTPS health endpoint
        run: curl --fail --silent --show-error --insecure https://localhost:8443/health

      - name: Stop Docker Compose
        if: always()
        run: docker compose down --remove-orphans
  publish-image:
    name: Publish image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality-and-container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/kristinajakovceska/opspulse:latest
            ghcr.io/kristinajakovceska/opspulse:${{ github.sha }}
